<!DOCTYPE html>
<html>

    <body class = "gallery-page">
         <nav class="navbar">
            <ul>
                <li><a href ="index.html#home">Home</a></li>
                <li><a href ="index.html#about">About</a></li>

        <h1 class = "page-title">Nature</h1>

        <div class= "nature-gallery">
            <img src = "cardinal.png">
            <img src = "whiteflower.png">
            <img src = "lighthouse.png">
            <img src = "riverwalk.png">
            <img src = "birdnest.png">
            <img src = "gondala.png">
            <img src = "tunnel.png">
            <img src = "hawaii.png">

            <img src = "IMG_1869.jpg">
            <img src = "bridge.png">
            <img src = "pinkflower2.png">
            <img src = "road.png">
            <img src = "forest2.jpg">
        </div>

        <div id="lightbox">
    <span id="close">&times;</span>
    <img id="lightbox-img">
</div>

<script>
const galleryImages = document.querySelectorAll(".nature-gallery img, .city-gallery img");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const close = document.getElementById("close");

galleryImages.forEach(img => {
    img.addEventListener("click", () => {
        lightbox.style.display = "flex";
        lightboxImg.src = img.src;
    });
});

close.addEventListener("click", () => {
    lightbox.style.display = "none";
});

lightbox.addEventListener("click", (e) => {
    if (e.target !== lightboxImg) {
        lightbox.style.display = "none";
    }
});
</script>








    </body>
</html>
